name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK firmada
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk CityTravel.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CityTravel-apk
          path: CityTravel.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: City Travel v1.0.${{ github.run_number }}
          make_latest: true
          files: CityTravel.apk
          body: |
            🚗⚡ **City Travel** — compilación automática #${{ github.run_number }}

            Descargá `CityTravel.apk`, abrila en tu Android y aceptá "instalar apps de origen desconocido".
            Todas las versiones están firmadas con la misma clave, así que se actualizan una encima de otra.
